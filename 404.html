<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Get the current path after the domain
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;

    // Remove '/photography_website' from the path if it exists
    const cleanPath = path.replace('/photography_website', '');

    // Construct the redirect URL
    const redirectUrl = '/photography_website/#' + cleanPath + search + hash;

    // Redirect to the main app
    window.location.replace(redirectUrl);
  </script>
</head>
<body>
  <p>Redirecting to the main application...</p>
</body>
</html>
